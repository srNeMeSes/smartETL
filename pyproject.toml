[project]
name = "smartetl"
version = "0.1.0"
description = "Processamento de dados e testes de hipótese (Flet)"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
# Os blocos de código do CLAUDE.md/README são documentação, não código executável.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Regras explícitas: o padrão do ruff não acusa `import *` (F403/F405).
select = ["E", "W", "F", "I", "N", "UP", "B", "RUF"]
# Símbolos gregos e matemáticos fazem parte dos textos da interface.
allowed-confusables = ["α", "μ", "σ", "ρ", "–"]
# Nomes de exceções de domínio definidos no CLAUDE.md (ErroValidacao, ErroExecucao).
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["app", "core"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
# Classes do domínio começam com "Teste" e funções antigas com "teste_": não coletar.
python_classes = ["Test_*"]
python_functions = ["test_*"]
addopts = "-p no:cacheprovider"
